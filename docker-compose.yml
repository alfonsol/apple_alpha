version: '3.8'

services:
  app:
    image: apple:latest 
    build:
      context: .                  
    ports:
      - "8080:8080"               
    depends_on:
      - redis                     
    networks:
      - app-net

  redis:
    image: redis:7
    ports:
      - "6379:6379"               
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
